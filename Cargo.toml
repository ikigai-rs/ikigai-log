[package]
name = "ikigai-log"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The line grammar and RDF vocabulary of the ikigai log: greppable one-line entries (`<ISO-8601 Z> <class CURIE> <subject IRI> key=value…`) that transrept mechanically into PROV-O-aligned Turtle. The key→property→range mapping and the per-class verbosity threshold are declared in the vocabulary graph, not in code, so a module extends both with `rdfs:subClassOf` and needs no change here."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-log"
homepage = "https://github.com/ikigai-rs/ikigai-log"
keywords = ["ikigai", "roc", "logging", "provenance", "rdf"]
categories = ["development-tools::debugging", "web-programming"]

# `File::try_lock` (stable since 1.89) is how one instance name is held by one
# process without a stale-lock story: the OS releases an advisory lock when the
# process dies, so a crash cannot strand the name.
rust-version = "1.89"

[dependencies]
# The published kernel, consumed from crates.io — the SAME version the hosts
# use, so a host links exactly one `ikigai-core`. 0.1.93 is the true minimum:
# the principal a tracer attributes an entry to is read from the capability the
# request ran under (`Capability::principal`, `PRINCIPAL_SCOPE_PREFIX`), and this
# crate's `MAX_PRINCIPAL_LEN` IS core's constant (ledger #1077) — all three
# arrived in 0.1.93 and nowhere earlier. Before that: `DENIED_NOTE` (0.1.62,
# what makes a pre-dispatch refusal reach an observer at all), the
# `config::{config_home, layered_paths_in, data_home_in}` path algebra the
# layered `log.toml` reads (0.1.56), and older still `Tracer`, `TraceEvent`,
# `Kernel::set_tracer`, ActionSpec, ArgSpec `class`/`one_of`/`default_value`,
# `Error::Denied`, `Invocation::now`, and `Kernel::issue_traced`/`TraceScope`
# (0.1.48, the per-call tracer seam the per-tenant `LogTracer` is handed to).
#
# ⚠ Read the caret as a RANGE: `"0.1.93"` is `>=0.1.93, <0.2.0`. Core is still
# on the 0.1 line, so the ceiling binds nothing today; it will on core 0.2.
ikigai-core = "0.1.93"

# The read endpoints are `Endpoint` impls rather than `FnEndpoint` closures —
# they carry a vocabulary and a handle — and `Endpoint::invoke` is `async_trait`.
async-trait = "0.1"

# The layered `log.toml`. `deny_unknown_fields` on every layer is what makes a
# misspelled key loud; pure Rust, so the config half stays wasm-clean.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The vocabulary is parsed, not hard-coded — a module's own `rdfs:subClassOf`
# extension is loaded the same way at runtime, which is what makes the term
# table data rather than a match arm. Oxigraph's pure-Rust oxrdf/oxrdfio are
# wasm-clean (the same pair ikigai-sign parses signature-graphs with).
oxrdf = "0.3"
oxrdfio = "0.2"

# The digest tag, taken and not copied. `ikigai-log`'s `#seal` lines carry
# `sig:contentHash` — the SAME predicate `ikigai-sign` writes — so writing two
# lexical forms of one value would mean the two never join in a query: a silent
# failure, not a loud one. 0.2.0 is the true minimum: `HASH_ALG_SHA256` was
# exported there, for this consumer, in the same release that started tagging.
#
# ⚠ The cost is real and worth stating: this pulls ed25519-dalek, p256, base64
# and their transitive stack in for one `&str` — into the WASM build too, where
# nothing here signs anything. It compiles clean on wasm32 and needs no
# `.cargo/config.toml` (checked), but a `sig:`-tag crate, or features on
# ikigai-sign, would be the honest shape of this dependency.
ikigai-sign = "0.2"

# SHA-256 for the hash chain (RustCrypto, pure Rust, wasm-clean) — the same
# implementation ikigai-sign digests with, which is not a coincidence worth
# leaving to chance: the two must agree on what `sha256:` means.
sha2 = "0.10"

# oxrdf/oxrdfio pull getrandom 0.3, which refuses to compile for
# wasm32-unknown-unknown until a backend is named — and the browser destination
# writes these same lines through `console.log`, so the wasm build is real. The
# feature alone suffices with getrandom 0.3.4 (older versions also wanted a
# `getrandom_backend` rustflag, hence the `.cargo/config.toml` some sibling
# crates still carry). Unused at runtime: nothing here generates randomness.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
futures = "0.3" # block_on, for the endpoint tests

# The end-to-end test that the named-graph story is real rather than assumed: a
# segment resolved through the kernel and handed to `urn:sparql:select` as
# `graph=<segment IRI>`, answering a `GRAPH ?g { … }` query with the segment's
# own IRI as ?g. Nothing in this crate implements that — it is what resolving to
# Turtle at your own IRI BUYS — so asserting it needs the real consumer, and a
# hand-rolled stand-in would prove nothing. Dev-only: a host mounts whichever
# SPARQL space it wants, and this crate depends on none of them at runtime.
ikigai-sparql = "0.1.6"

# The module recipe as one test (`tests/conformance.rs`): every endpoint this
# crate binds, every action each declares, every checkable rule at once.
#
# ⚠ Under Cargo's 0.x rules this pin is a CEILING as well as a floor: `"0.6.0"`
# means `>=0.6.0, <0.7.0`. The previous `"0.2.0"` pin froze this crate out of
# 0.3 (AUTHORITY), 0.4 (request-memoized firing), 0.5 (own-name purity) and 0.6
# (SPACE-NAME) while the suite kept reporting green against the old definition
# of "done". 0.6.0 is the floor because the suite declares both space
# constructors host-named (`Suite::host_named_space`, new there); it pulls
# ikigai-core 0.1.89, which the library caret above admits. Raise this pin
# deliberately when 0.7 ships, and read what it checks.
ikigai-conformance = "0.6.0"
